mdia_tool:
  flags:
    - flag: "-h / --help"
      description: "In hướng dẫn sử dụng ra terminal."

  types:
    - name: "open"
      description: "Mở project trong IDE"
      actions:
        - id: "ACTION 00"
          title: "Mở dự án (Open)"
          command: "mda open [-a]"
          summary: "Mở project mdia-studio trong Editor/IDE."
          details: "Dựa vào cờ -a, mặc định sẽ mở bằng lệnh `code` cho VSCode. Khi thêm -a sẽ sử dụng `anti` cho Antigravity IDE."
          conditions: "Cần đảm bảo IDE đã đưa CLI vào biến môi trường PATH."
          parameters: "[-a]: Cờ tùy chọn để chỉ định mở bằng Antigravity IDE thay vì VSCode."

    - name: "app"
      description: "Ứng dụng GUI"
      actions:
        - id: "ACTION 01"
          title: "Mở ứng dụng Video Player"
          command: "mda app player"
          summary: "Khởi động giao diện người dùng cho Video Player."
          details: "Chạy file `video_player.py` bằng Python."
          conditions: "Không có"
          parameters: "Không có tham số."

    - name: "video"
      description: "Các tính năng xử lý video"
      actions:
        - id: "ACTION 02"
          title: "Xóa Watermark/Logo"
          command: "mda video rm-logo <input_path> <x1,y1,x2,y2> [output_path]"
          summary: "Tự động xóa watermark/logo khỏi video theo vùng tọa độ chỉ định."
          details: "Chạy script `video_watermark_remover.py` sử dụng FFmpeg. CLI nhận hai góc (x1,y1) và (x2,y2), sau đó tự tính w=x2-x1 và h=y2-y1 để truyền vào filter delogo."
          conditions: "input_path và bộ tọa độ là bắt buộc. x2 phải lớn hơn x1, y2 phải lớn hơn y1. Yêu cầu có FFmpeg."
          parameters: "<input_path>: Video đầu vào. <x1,y1,x2,y2>: Hai góc của vùng cần xóa. [output_path]: Tùy chọn đường dẫn đầu ra."

        - id: "ACTION 08"
          title: "Xác định vùng Logo"
          command: "mda video locate-logo <input_path> <timestamp>"
          summary: "Trích một frame và mở UI để chọn chính xác vùng logo theo pixel gốc của video."
          details: "FFmpeg trích đúng 1 frame trực tiếp qua memory pipe, không tạo file tạm. PySide6 hiển thị frame fit-to-window; thao tác kéo chuột được map ngược về native pixel coordinates và xuất x1,y1,x2,y2. Có Reset, Copy Coordinates và Enter để xác nhận."
          conditions: "Yêu cầu FFmpeg và PySide6. Timestamp hỗ trợ số giây, MM:SS hoặc HH:MM:SS(.ms)."
          parameters: "<input_path>: Video đầu vào. <timestamp>: Thời điểm lấy frame, vd: 15.5 hoặc 00:01:25.500."

        - id: "ACTION 07"
          title: "Trích xuất Image Frames"
          command: "mda video frames <input_path> <gap_time> [limit]"
          summary: "Xuất các khung hình từ một video thành hàng loạt ảnh tĩnh (PNG)."
          details: "Sử dụng FFmpeg để phân tích cú pháp thời gian (gap_time, vd: 5s, 200ms) sang tỉ lệ fps tương ứng và xuất ra ảnh PNG chất lượng cao (lossless) tuần tự. Kết quả lưu tự động."
          conditions: "Cần tham số input_path và khoảng thời gian (gap_time) giữa các ảnh."
          parameters: "<input_path>: Đường dẫn video đầu vào. <gap_time>: Khảng thời gian (vd: 5s, 200ms). [limit]: Tùy chọn giới hạn số lượng."

    - name: "audio"
      description: "Các tính năng xử lý âm thanh"
      actions:
        - id: "ACTION 03"
          title: "Tách âm thanh"
          command: "mda audio extract <input_path> <output_path>"
          summary: "Tách âm thanh từ file video sang chuẩn .wav hoặc .mp3."
          details: "Sử dụng FFmpeg để process tách audio without re-encoding (đối với .wav, stream pcm_s16le, còn .mp3 encode qua libmp3lame)."
          conditions: "Tham số input và output path là bắt buộc và phải là absolute path. Cần FFmpeg."
          parameters: "<input_path>: Đường dẫn ảnh/video có chứa âm thanh gốc. <output_path>: Đường dẫn xuất file đích (.wav, .mp3)."

    - name: "image"
      description: "Các tính năng xử lý hình ảnh"
      actions:
        - id: "ACTION 04"
          title: "Lật ảnh"
          command: "mda image flip <input_path> <horizontal|vertical> [output_path]"
          summary: "Lật ảnh theo chiều ngang hoặc chiều dọc."
          details: "Chạy script `flip_image.py` bằng Pillow. Input path phải là đường dẫn tuyệt đối tới file ảnh. Nếu không truyền output_path, file kết quả sẽ được lưu cạnh ảnh gốc với hậu tố hướng lật."
          conditions: "Tham số input_path và hướng lật là bắt buộc."
          parameters: "<input_path>: Đường dẫn tuyệt đối của ảnh đầu vào. <horizontal|vertical>: Hướng lật ảnh. [output_path]: Tùy chọn đường dẫn tuyệt đối của file kết quả."

        - id: "ACTION 04b"
          title: "Xoay ảnh"
          command: "mda image rotate <input_path> <degrees> [output_path]"
          summary: "Xoay ảnh theo số độ chỉ định."
          details: "Dùng PIL.Image để xoay ảnh (expand=True để không cắt xén). Nhập số âm để xoay cùng chiều kim đồng hồ."
          conditions: "Tham số input_path và degrees (số độ) là bắt buộc."
          parameters: "<input_path>: Đường dẫn tuyệt đối của ảnh đầu vào. <degrees>: Số độ xoay (vd: 90, -45). [output_path]: Tùy chọn đường dẫn tuyệt đối của file kết quả."

    - name: "media"
      description: "Các tính năng xử lý media đa dụng"
      actions:
        - id: "ACTION 06"
          title: "Chia nhỏ file media theo thời gian"
          command: "mda media part-time <input_path> <duration> [limit]"
          summary: "Cắt file âm thanh/video thành nhiều phần nhỏ dựa trên thời lượng (vd: 20s, 3p). Có thể giới hạn số lượng phân đoạn."
          details: "Sử dụng FFmpeg segment muxer với stream copy để chia tệp mà không tái mã hóa. Các phần nhỏ sẽ được tự động lưu vào 1 thư mục riêng biệt kèm theo timestamp hiện tại. Tham số 'limit' giúp chống việc tạo ra số lượng file rác quá lớn."
          conditions: "Tham số input_path và duration bắt buộc."
          parameters: "<input_path>: File media đầu vào. <duration>: Thời gian cắt mỗi file (giây/phút). [limit]: Giới hạn số lượng cắt."

    - name: "git"
      description: "Thao tác Git"
      actions:
        - id: "ACTION 08"
          title: "Git Commit & Push"
          command: "mda git commit -m <message>"
          summary: "Tự động quá trình staging, commit và đẩy code lên Github."
          details: "Chạy script `_media_studio_git.py` để thực hiện tổ hợp các lệnh: `git add .`, `git commit -m` và `git push origin main` một cách tự động."
          conditions: "Yêu cầu phải có tham số `-m '<thông điệp>'` hoặc `--message '<thông điệp>'`."
          parameters: "-m / --message: Tham số bắt buộc, thông điệp đăng tải commit."

    - name: "dld"
      description: "Các tính năng tải xuống Media (Downloader)"
      actions:
        - id: "ACTION 09"
          title: "Tải Video / Audio từ mạng xã hội"
          command: "mda dld <platform> <url> [--option <opt>] [--filename <name>] [--folder <path>] [--format <ext>] [--threads <n>] [--mode <mode>] [--slice <time>]"
          summary: "Tải video, audio hoặc phụ đề đa nền tảng. YouTube/YT Music/Facebook/Instagram/TikTok/Twitter/Bilibili/SoundCloud dùng yt-dlp + aria2c. Spotify dùng spotDL (chỉ audio). Douyin dùng jiji262/douyin-downloader (no-watermark, hỗ trợ batch profile)."
          details: "Kiến trúc: (1) BaseDownloader (yt-dlp+aria2c) cho hầu hết nền tảng — tự động tăng tốc bằng aria2c multi-connection. (2) SpotifyDownloader (spotdl CLI) — đọc client credentials từ .env. (3) DouyinDownloader (submodule jiji262). TikTok: thử format download_addr-0 (no-watermark) trước; nếu thất bại tự fallback sang bản có watermark. SoundCloud: mọi option video đều được chuyển tự động sang audio."
          parameters: "<platform> — BẮT BUỘC. Nền tảng cần tải. Giá trị hợp lệ: [list] Liệt kê nền tảng | [ytb] YouTube | [ytb-music] YouTube Music | [fb] Facebook | [insta] Instagram | [tiktok] TikTok (tự thử no-watermark) | [twitter / x] Twitter (X) | [douyin] Douyin (engine riêng, dùng --mode cho batch) | [bilibili / bili / bilili] Bilibili (3 alias cùng class) | [scloud / soundcloud] SoundCloud (2 alias) | [spot] Spotify (chỉ audio, cần credentials .env). /// <url> — BẮT BUỘC. URL đầy đủ của nội dung cần tải (video đơn, playlist, profile...)."
          flags: "--option <opt> — Chất lượng tải cho yt-dlp platforms (mặc định: good-vid). Không áp dụng cho Douyin/Spotify. Giá trị: [good-vid] Video 720p (bv*[height<=720]+ba) — cân bằng chất lượng/dung lượng | [best-vid] Video chất lượng cao nhất (bv*+ba/b) | [audio] Chỉ tải audio, chuyển sang định dạng chỉ định bởi --format (mặc định mp3) | [sub] Chỉ tải phụ đề SRT/VTT, không tải video (không dùng aria2c) | [thumb] Chỉ tải ảnh bìa (thumbnail) | [img] Tải toàn bộ ảnh có trong link. /// --mode <mode> — Chế độ batch cho Douyin (chỉ dùng với platform=douyin). Giá trị: [post] toàn bộ video đã đăng | [like] video đã thích | [mix] theo mix/playlist | [music] theo nhạc | [favorites] video đã lưu. /// --filename <name> — Tên file đầu ra không bao gồm đuôi mở rộng. Spotify dùng template {stem}.{output-ext}. /// --folder <path> — Thư mục lưu file tải về. Mặc định: thư mục hiện tại. /// --format <ext> — Định dạng file đầu ra. Video: mp4, mkv, webm, ogg, flv. Audio (--option audio): mp3, m4a, wav, flac, opus, vorbis, aac, alac. Phụ đề (--option sub): srt, vtt, ass, lrc. Ảnh bìa (--option thumb): jpg, png, webp. Spotify mặc định mp3. /// --threads <n> — Số luồng tải song song cho aria2c (số nguyên >= 1, mặc định 4). Không áp dụng khi --option sub/thumb/img. Douyin mặc định 5 luồng. /// --slice <time> — Cắt khoảng thời gian khi tải (chỉ dùng cho YouTube/YT Music). Định dạng: HH:MM:SS-HH:MM:SS (hoặc giây)."
          conditions: "Chung: yt-dlp (pip install yt-dlp) và aria2c trong PATH. /// Spotify: spotdl CLI (khuyên dùng pipx install spotdl) + SPOTIFY_CLIENT_ID và SPOTIFY_CLIENT_SECRET trong file .env (lấy tại developer.spotify.com/dashboard). /// Douyin: git submodule jiji262/douyin-downloader (git submodule update --init), Playwright (pip install playwright && playwright install)."

        - id: "ACTION 10"
          title: "Liệt kê danh sách nền tảng được hỗ trợ"
          command: "mda dld list"
          summary: "In ra danh sách các nền tảng có thể tải về bằng lệnh dld."
          details: "Mở rộng của lệnh mda dld để giúp người dùng xem nhanh alias của các platform."
          conditions: "Không có"
          parameters: "Không có tham số."

        - id: "ACTION 11"
          title: "Cập nhật yt-dlp lên bản mới nhất"
          command: "mda dld update"
          summary: "Tự động tải và cài đặt phiên bản yt-dlp mới nhất từ PyPI."
          details: "Thực thi nâng cấp gói yt-dlp thông qua pip để khắc phục các lỗi stream 403 Forbidden do YouTube cập nhật thuật toán bot detection/cipher."
          conditions: "Yêu cầu kết nối Internet."
          parameters: "Không có tham số."

config:
  ROOT_FOLDER_PATH: "Đường dẫn gốc của dự án mdia-studio."

