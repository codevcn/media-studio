mdia_tool:
  dispatcher_flags:
    - flag: "-v / --version"
      description: "In thông tin phiên bản và mô tả của công cụ (bằng tiếng Anh)."
    - flag: "--info"
      description: "In mô tả chi tiết của lệnh từ app_features.yml (không thực thi lệnh)."
    - flag: "-a / --anti"
      description: "Dùng Antigravity IDE thay vì VSCode khi mở dự án."
    - flag: "-f / --file_explorer"
      description: "Mở thư mục dự án trong Windows File Explorer."
    - flag: "-h / --help"
      description: "In toàn bộ hướng dẫn sử dụng ra terminal."

  types:
    - name: "open"
      description: "Mở project trong IDE (VSCode / Antigravity) hoặc File Explorer"
      actions:
        - id: "ACTION 00"
          title: "Mở dự án (Open)"
          command: "mda open [-a | -f]"
          summary: "Mở project media-studio trong Editor/IDE hoặc Windows File Explorer."
          details: "Mặc định mở bằng VSCode (`code`). Thêm `-a` hoặc `--anti` để mở bằng Antigravity IDE (`anti`). Thêm `-f` hoặc `--file_explorer` để mở thư mục trong Windows Explorer."
          conditions: "Cần đảm bảo IDE đã được thêm vào biến môi trường PATH."
          parameters: "[-a / --anti]: Mở bằng Antigravity IDE. [-f / --file_explorer]: Mở bằng Windows File Explorer."

    - name: "app"
      description: "Ứng dụng GUI (Trình phát video kép đối chiếu)"
      actions:
        - id: "ACTION 01"
          title: "Mở ứng dụng Video Player"
          command: "mda app player"
          summary: "Khởi động giao diện PySide6 cho trình phát video kép (Dual Video Player)."
          details: "Chạy file `video_player.py`. Cho phép phát song song 2 video từ data/video/input và data/video/output để đối chiếu chất lượng trước/sau xử lý, hỗ trợ đồng bộ playback và chuyển kênh âm thanh linh hoạt."
          conditions: "Yêu cầu PySide6 và OpenCV."
          parameters: "Không có tham số."

    - name: "video"
      description: "Các tính năng xử lý video (Xóa logo/watermark, trích frames)"
      actions:
        - id: "ACTION 02"
          title: "Xóa Watermark/Logo"
          command: "mda video rm-logo <input_path> <x1,y1,x2,y2> [output_path]"
          summary: "Tự động xóa watermark/logo khỏi video theo vùng tọa độ chỉ định bằng FFmpeg delogo."
          details: "Chạy script `video_watermark_remover.py`. CLI nhận hai góc (x1,y1) và (x2,y2), tự tính w=x2-x1 và h=y2-y1 rồi áp dụng filter `delogo=x={x}:y={y}:w={w}:h={h}`, encode libx264 và giữ nguyên luồng audio."
          conditions: "input_path và bộ tọa độ là bắt buộc. x2 > x1, y2 > y1. Yêu cầu FFmpeg."
          parameters: "<input_path>: Video đầu vào. <x1,y1,x2,y2>: Tọa độ hai góc vùng cần xóa. [output_path]: Tùy chọn đường dẫn đầu ra."

        - id: "ACTION 08"
          title: "Xác định vùng Logo (Interactive Locator)"
          command: "mda video locate-logo <input_path> <timestamp>"
          summary: "Trích một frame và mở UI PySide6 để kéo chọn chính xác tọa độ vùng logo theo pixel gốc."
          details: "FFmpeg trích đúng 1 frame trực tiếp qua memory pipe. PySide6 hiển thị frame fit-to-window; thao tác kéo chuột được map ngược về native pixel coordinates và xuất ra chuỗi x1,y1,x2,y2 sẵn sàng cho lệnh rm-logo."
          conditions: "Yêu cầu FFmpeg và PySide6. Timestamp hỗ trợ số giây, MM:SS hoặc HH:MM:SS(.ms)."
          parameters: "<input_path>: Video đầu vào. <timestamp>: Thời điểm lấy frame (vd: 15.5 hoặc 00:01:25.500)."

        - id: "ACTION 07"
          title: "Trích xuất Image Frames"
          command: "mda video frames <input_path> <gap_time> [limit]"
          summary: "Xuất các khung hình từ video thành hàng loạt ảnh PNG lossless theo chu kỳ thời gian."
          details: "Sử dụng FFmpeg để phân tích cú pháp khoảng thời gian (vd: 5s, 200ms, 2m) sang tỉ lệ fps tương ứng và xuất ra ảnh PNG tuần tự vào thư mục riêng kèm timestamp."
          conditions: "Cần tham số input_path và gap_time. Yêu cầu FFmpeg."
          parameters: "<input_path>: Đường dẫn video đầu vào. <gap_time>: Khoảng thời gian giãn cách (vd: 5s, 200ms, 2m). [limit]: Giới hạn số lượng ảnh trích xuất."

    - name: "audio"
      description: "Các tính năng xử lý âm thanh"
      actions:
        - id: "ACTION 03"
          title: "Tách âm thanh từ video"
          command: "mda audio extract <input_path> <output_path>"
          summary: "Tách luồng âm thanh từ file video sang định dạng .wav (PCM lossless) hoặc .mp3 (chất lượng cao)."
          details: "Sử dụng FFmpeg tách audio. Xuất .wav dùng codec pcm_s16le, xuất .mp3 dùng codec libmp3lame với preset -q:a 2."
          conditions: "Tham số input_path và output_path là bắt buộc. Yêu cầu FFmpeg."
          parameters: "<input_path>: Đường dẫn video đầu vào. <output_path>: Đường dẫn xuất file audio (.wav hoặc .mp3)."

    - name: "image"
      description: "Các tính năng xử lý hình ảnh (Lật ảnh, xoay ảnh)"
      actions:
        - id: "ACTION 04"
          title: "Lật ảnh"
          command: "mda image flip <input_path> <horizontal|vertical> [output_path]"
          summary: "Lật hình ảnh theo chiều ngang (horizontal) hoặc chiều dọc (vertical) bằng Pillow."
          details: "Chạy script `flip_image.py`. Nếu không truyền output_path, file kết quả sẽ được tự động lưu cạnh ảnh gốc kèm hậu tố hướng lật."
          conditions: "Tham số input_path và hướng lật là bắt buộc. Yêu cầu thư viện Pillow."
          parameters: "<input_path>: Đường dẫn ảnh đầu vào. <horizontal|vertical>: Hướng lật ảnh. [output_path]: Tùy chọn đường dẫn lưu kết quả."

        - id: "ACTION 04b"
          title: "Xoay ảnh"
          command: "mda image rotate <input_path> <degrees> [output_path]"
          summary: "Xoay hình ảnh theo số độ chỉ định bằng Pillow (expand=True không làm mất góc)."
          details: "Dùng PIL.Image để xoay ảnh. Hỗ trợ số dương (ngược chiều kim đồng hồ) và số âm (cùng chiều kim đồng hồ)."
          conditions: "Tham số input_path và degrees (số độ) là bắt buộc. Yêu cầu Pillow."
          parameters: "<input_path>: Đường dẫn ảnh đầu vào. <degrees>: Số độ xoay (vd: 90, 180, -45). [output_path]: Tùy chọn đường dẫn lưu kết quả."

    - name: "media"
      description: "Các tính năng xử lý media đa dụng (Cắt slice, chia theo dung lượng / thời lượng)"
      actions:
        - id: "ACTION 05"
          title: "Cắt đoạn media (Stream Copy)"
          command: "mda media slice <input_path> <start-end> [output_name]"
          summary: "Cắt một đoạn từ file media theo mốc thời gian start-end bằng FFmpeg Stream Copy (-c copy) không re-encode."
          details: "Chạy script `slice_media.py`. Định dạng start-end hỗ trợ MM:SS-MM:SS hoặc HH:MM:SS-HH:MM:SS. Xử lý tức thời trong vài giây và giữ nguyên 100% chất lượng gốc."
          conditions: "input_path và khoảng thời gian start-end là bắt buộc. Yêu cầu FFmpeg."
          parameters: "<input_path>: File media đầu vào. <start-end>: Khoảng thời gian cắt (vd: 00:10-01:22). [output_name]: Tùy chọn tên file đầu ra."

        - id: "ACTION 05b"
          title: "Chia nhỏ media theo dung lượng (MB)"
          command: "mda media part-size <input_path> <size_mb> [limit]"
          summary: "Chia nhỏ file video/audio thành nhiều phần sao cho mỗi phần không vượt quá số MB chỉ định."
          details: "Chạy script `part_media_by_size.py`. Dùng ffprobe tính toán bitrate và thời lượng, áp dụng hệ số an toàn 0.995 rồi cắt bằng FFmpeg Stream Copy (-c copy)."
          conditions: "input_path và size_mb là bắt buộc. Yêu cầu FFmpeg & ffprobe."
          parameters: "<input_path>: File media đầu vào. <size_mb>: Dung lượng tối đa mỗi phần (MB). [limit]: Tùy chọn giới hạn số lượng phần chia."

        - id: "ACTION 06"
          title: "Chia nhỏ media theo thời lượng"
          command: "mda media part-time <input_path> <duration> [limit]"
          summary: "Cắt file âm thanh/video thành nhiều phần đều nhau dựa trên khoảng thời lượng (vd: 20s, 3m)."
          details: "Sử dụng FFmpeg segment muxer với stream copy (-c copy) để chia tệp mà không tái mã hóa. Các phần nhỏ được lưu vào thư mục riêng kèm timestamp."
          conditions: "Tham số input_path và duration là bắt buộc. Yêu cầu FFmpeg."
          parameters: "<input_path>: File media đầu vào. <duration>: Thời lượng mỗi phần (vd: 20s, 3m). [limit]: Tùy chọn giới hạn số phần cắt."

    - name: "ocr"
      description: "Nhận diện văn bản từ hình ảnh (PaddleOCR)"
      actions:
        - id: "ACTION 06b"
          title: "Quét và nhận diện chữ trong ảnh"
          command: "mda ocr scan <input_path> [--output log|file] [--dest <path>]"
          summary: "Nhận diện toàn bộ văn bản trong file ảnh bằng PaddleOCR và xuất ra terminal hoặc file text."
          details: "Chạy script `scan_ocr.py`. Tự động cấu hình tắt PIR API và MKLDNN để vận hành ổn định trên CPU mà không bị crash lỗi PaddlePaddle."
          conditions: "Yêu cầu paddlepaddle==2.6.2 và paddleocr==2.8.1."
          parameters: "<input_path>: Đường dẫn ảnh cần quét chữ."
          flags: "--output log|file: Xuất kết quả ra log terminal hoặc lưu vào file text (mặc định: log). /// --dest <path>: Đường dẫn file text đích nếu chọn --output file."

    - name: "git"
      description: "Thao tác tự động hóa Git"
      actions:
        - id: "ACTION 08"
          title: "Git Commit & Push"
          command: "mda git commit -m <message>"
          summary: "Tự động hóa chuỗi thao tác Git: git add . -> git commit -m -> git push."
          details: "Chạy script `_media_studio_git.py` để thực hiện toàn bộ quy trình đẩy code lên GitHub chỉ với một câu lệnh duy nhất."
          conditions: "Yêu cầu phải truyền cờ `-m '<thông điệp>'` hoặc `--message '<thông điệp>'`."
          parameters: "-m / --message: Thông điệp commit bắt buộc."

    - name: "dld"
      description: "Các tính năng tải xuống Media đa nền tảng (Downloader)"
      actions:
        - id: "ACTION 09"
          title: "Tải Video / Audio từ mạng xã hội"
          command: "mda dld <platform> <url> | mda dld ytb | mda dld ytb-music | mda dld fb | mda dld insta | mda dld tiktok | mda dld twitter | mda dld x | mda dld douyin | mda dld bilibili | mda dld bili | mda dld bilili | mda dld soundcloud | mda dld scloud | mda dld spot | mda dld spotify"
          summary: "Tải video, audio hoặc phụ đề đa nền tảng. YouTube/YT Music/Facebook/Instagram/TikTok/Twitter/Bilibili/SoundCloud dùng yt-dlp + aria2c. Spotify dùng spotDL (chỉ audio). Douyin dùng jiji262/douyin-downloader (no-watermark, hỗ trợ batch profile)."
          details: "Kiến trúc: (1) BaseDownloader (yt-dlp+aria2c) tự động tăng tốc đa kết nối. (2) SpotifyDownloader (spotdl CLI) đọc API credentials từ .env. (3) DouyinDownloader (submodule jiji262) hỗ trợ tải profile/mix/favorite qua --mode. TikTok tự thử format no-watermark trước. SoundCloud tự động chuyển sang tải audio."
          parameters: "<platform> — BẮT BUỘC. Nền tảng cần tải (ytb, fb, insta, tiktok, twitter/x, douyin, bili, scloud, spot). /// <url> — BẮT BUỘC. URL đầy đủ của media cần tải."
          flags: "--option <opt> — Loại tải: good-vid (mặc định 720p), best-vid (gốc), audio, sub, thumb, img. /// --mode <mode> — Chế độ batch Douyin: post | like | mix | music | favorites. /// --filename <name> — Tên file xuất (không đuôi). /// --folder <path> — Thư mục lưu file tải về. /// --format <ext> — Định dạng file (mp4, mp3, wav, flac...). /// --threads <n> — Số luồng aria2c (mặc định 4). /// --slice <time> — Cắt đoạn thời gian tải (YouTube). /// --noti [telegram] — Gửi thông báo Telegram khi tải xong."
          conditions: "Chung: yt-dlp và aria2c trong PATH. Spotify: spotdl CLI + SPOTIFY_CLIENT_ID & SECRET trong .env. Douyin: git submodule jiji262/douyin-downloader + Playwright."

        - id: "ACTION 10"
          title: "Liệt kê danh sách nền tảng được hỗ trợ"
          command: "mda dld list"
          summary: "In ra danh sách các nền tảng và các alias hỗ trợ cho lệnh mda dld."
          details: "Mở rộng của lệnh mda dld giúp người dùng xem nhanh các alias hợp lệ của từng nền tảng."
          conditions: "Không có."
          parameters: "Không có tham số."

        - id: "ACTION 11"
          title: "Cập nhật yt-dlp lên bản mới nhất"
          command: "mda dld update"
          summary: "Tự động nâng cấp gói yt-dlp lên phiên bản mới nhất từ PyPI."
          details: "Thực thi nâng cấp yt-dlp qua pip để khắc phục các lỗi stream 403 Forbidden hoặc chặn bot từ YouTube/mạng xã hội."
          conditions: "Yêu cầu kết nối Internet."
          parameters: "Không có tham số."

config:
  ROOT_FOLDER_PATH: "Đường dẫn gốc của dự án media-studio."


