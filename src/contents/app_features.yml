mdia_tool:
  flags:
    - flag: "-h / --help"
      description: "In hướng dẫn sử dụng ra terminal."

  types:
    - name: "open"
      description: "Mở project trong IDE"
      actions:
        - id: "ACTION 00"
          title: "Mở dự án (Open)"
          command: "mda open [-a]"
          summary: "Mở project mdia-studio trong Editor/IDE."
          details: "Dựa vào cờ -a, mặc định sẽ mở bằng lệnh `code` cho VSCode. Khi thêm -a sẽ sử dụng `anti` cho Antigravity IDE."
          conditions: "Cần đảm bảo IDE đã đưa CLI vào biến môi trường PATH."
          parameters: "[-a]: Cờ tùy chọn để chỉ định mở bằng Antigravity IDE thay vì VSCode."

    - name: "app"
      description: "Ứng dụng GUI"
      actions:
        - id: "ACTION 01"
          title: "Mở ứng dụng Video Player"
          command: "mda app player"
          summary: "Khởi động giao diện người dùng cho Video Player."
          details: "Chạy file `video_player.py` bằng Python."
          conditions: "Không có"
          parameters: "Không có tham số."

    - name: "video"
      description: "Các tính năng xử lý video"
      actions:
        - id: "ACTION 02"
          title: "Xóa Watermark/Logo"
          command: "mda video rm-logo <input_path> <x,y,w,h> [output_path]"
          summary: "Tự động xóa watermark/logo khỏi video theo tọa độ chỉ định."
          details: "Chạy script `video_watermark_remover.py` sử dụng FFmpeg. Tọa độ (x,y,w,h) phải được nối bằng dấu phẩy (vd: 24,21,135,44). Tham số output_path là tùy chọn."
          conditions: "Tham số đầu vào và bộ tọa độ là bắt buộc. Yêu cầu có FFmpeg."
          parameters: "<input_path>: Đường dẫn tuyệt đối của video đầu vào. <x,y,w,h>: Tọa độ xóa (vd: 24,21,135,44). [output_path]: Tùy chọn đường dẫn đầu ra."

        - id: "ACTION 07"
          title: "Trích xuất Image Frames"
          command: "mda video frames <input_path> <gap_time> [limit]"
          summary: "Xuất các khung hình từ một video thành hàng loạt ảnh tĩnh (PNG)."
          details: "Sử dụng FFmpeg để phân tích cú pháp thời gian (gap_time, vd: 5s, 200ms) sang tỉ lệ fps tương ứng và xuất ra ảnh PNG chất lượng cao (lossless) tuần tự. Kết quả lưu tự động."
          conditions: "Cần tham số input_path và khoảng thời gian (gap_time) giữa các ảnh."
          parameters: "<input_path>: Đường dẫn video đầu vào. <gap_time>: Khảng thời gian (vd: 5s, 200ms). [limit]: Tùy chọn giới hạn số lượng."

    - name: "audio"
      description: "Các tính năng xử lý âm thanh"
      actions:
        - id: "ACTION 03"
          title: "Tách âm thanh"
          command: "mda audio extract <input_path> <output_path>"
          summary: "Tách âm thanh từ file video sang chuẩn .wav hoặc .mp3."
          details: "Sử dụng FFmpeg để process tách audio without re-encoding (đối với .wav, stream pcm_s16le, còn .mp3 encode qua libmp3lame)."
          conditions: "Tham số input và output path là bắt buộc và phải là absolute path. Cần FFmpeg."
          parameters: "<input_path>: Đường dẫn ảnh/video có chứa âm thanh gốc. <output_path>: Đường dẫn xuất file đích (.wav, .mp3)."

    - name: "image"
      description: "Các tính năng xử lý hình ảnh"
      actions:
        - id: "ACTION 04"
          title: "Lật ảnh"
          command: "mda image flip"
          summary: "Lật phương ngang đối với thư mục ảnh đầu vào."
          details: "Chạy script `flip_image.py`. Hiện tại config đang hardcoded từ `input.jpg` chạy ra `output.jpg`."
          conditions: "Cần cài đặt thư viện PIL (Pillow)."
          parameters: "Không có tham số."

    - name: "media"
      description: "Các tính năng xử lý media đa dụng"
      actions:
        - id: "ACTION 05"
          title: "Cắt nhỏ file media theo dung lượng"
          command: "mda media part-size <input_path> <size_mb> [limit]"
          summary: "Cắt file âm thanh/video dài thành nhiều phần có dung lượng bằng nhau. Có thể giới hạn số lượng phân đoạn đầu ra."
          details: "Sử dụng FFmpeg stream copy để cắt cực nhanh các loại file như .wav, .mp3, .mp4 theo dung lượng (MB) chỉ định mà không encode lại. Các phần nhỏ sẽ được tự động lưu chung vào 1 thư mục với tên theo thời gian cắt. Tham số cuối cùng 'limit' dùng để giới hạn số file, không giới hạn nếu bỏ trống."
          conditions: "Tham số input_path và size_mb bắt buộc."
          parameters: "<input_path>: File media đầu vào. <size_mb>: Kích thước (MB). [limit]: Giới hạn số lượng cắt."

        - id: "ACTION 06"
          title: "Chia nhỏ file media theo thời gian"
          command: "mda media part-time <input_path> <duration> [limit]"
          summary: "Cắt file âm thanh/video thành nhiều phần nhỏ dựa trên thời lượng (vd: 20s, 3p). Có thể giới hạn số lượng phân đoạn."
          details: "Sử dụng FFmpeg segment muxer với stream copy để chia tệp mà không tái mã hóa. Các phần nhỏ sẽ được tự động lưu vào 1 thư mục riêng biệt kèm theo timestamp hiện tại. Tham số 'limit' giúp chống việc tạo ra số lượng file rác quá lớn."
          conditions: "Tham số input_path và duration bắt buộc."
          parameters: "<input_path>: File media đầu vào. <duration>: Thời gian cắt mỗi file (giây/phút). [limit]: Giới hạn số lượng cắt."

    - name: "git"
      description: "Thao tác Git"
      actions:
        - id: "ACTION 08"
          title: "Git Commit & Push"
          command: "mda git commit -m <message>"
          summary: "Tự động quá trình staging, commit và đẩy code lên Github."
          details: "Chạy script `media_studio_git.py` để thực hiện tổ hợp các lệnh: `git add .`, `git commit -m` và `git push origin main` một cách tự động."
          conditions: "Yêu cầu phải có tham số `-m '<thông điệp>'` hoặc `--message '<thông điệp>'`."
          parameters: "-m / --message: Tham số bắt buộc, thông điệp đăng tải commit."

    - name: "dld"
      description: "Các tính năng tải xuống Media (Downloader)"
      actions:
        - id: "ACTION 09"
          title: "Tải Video / Audio từ mạng xã hội"
          command: "mda dld <platform> <url> <option> [--filename] [--folder] [--format]"
          summary: "Tải video, audio hoặc phụ đề từ YouTube, Facebook, Instagram, TikTok bằng yt-dlp."
          details: "Module downloader đa nền tảng. Hỗ trợ các nền tảng: ytb, ytb-music, fb, insta, tiktok với các tùy chọn tải chất lượng tốt nhất, trung bình, tách âm thanh mp3 hoặc lưu phụ đề SRT. Hỗ trợ thêm tham số --format để chỉ định định dạng đầu ra (mp4, mkv, mp3, wav...)."
          conditions: "Yêu cầu thư viện yt-dlp. URL phải hợp lệ và public."
          parameters: "<platform>: ytb | ytb-music | fb | insta | tiktok. <url>: Đường dẫn video. <option>: best-vid | good-vid | audio | sub. [--filename]: Tên file. [--folder]: Thư mục đích. [--format]: Định dạng đích (mp4, mkv, mp3, wav...)"

config:
  ROOT_FOLDER_PATH: "Đường dẫn gốc của dự án mdia-studio."
